# Serves the built SPA and reverse-proxies /api to the API container, so the browser sees
# one origin: the session cookie stays SameSite=Lax and no CORS is needed.

# Hashed bundles never change, so cache them for a year; everything else is revalidated.
map $uri $cache_control {
    ~^/assets/ "public, max-age=31536000, immutable";
    default    "no-cache"; # includes /sw.js, /index.html and /manifest.webmanifest
}

# Behind another proxy (a TLS reverse proxy in production) keep the scheme the browser used; alone, use ours.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Reuse connections to the API instead of opening one per request: without this, every closed
# connection waits in TIME_WAIT and the edge runs out of local ports under load. Idle ones close
# before Node's own 5 s keep-alive.
upstream api {
    server api:3000;
    keepalive 64;
    keepalive_timeout 4s;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    gzip on;
    # Level 6 instead of nginx's default 1: the main bundle shrinks by about an eighth, for a
    # little CPU per request.
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header Cache-Control $cache_control always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # An add_header here replaces the ones above: the API's own helmet headers apply.
        add_header Cache-Control "no-store" always;
    }

    # Client-side routes (/tasks/:id) fall back to the app shell.
    location / {
        try_files $uri /index.html;
    }
}
